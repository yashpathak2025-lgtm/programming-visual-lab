name: Programming Visual Lab CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: programming_visual_lab_FINAL_PHASE5_SECURE_COMPLETE-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_api_contract.py
        env:
          PVL_EXECUTION_MODE: local
      - run: python -m py_compile app/main.py app/executor.py app/sandbox_runner.py

  docker-sandbox-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f programming_visual_lab_FINAL_PHASE5_SECURE_COMPLETE-1/Dockerfile.sandbox -t programming-visual-lab-sandbox:ci programming_visual_lab_FINAL_PHASE5_SECURE_COMPLETE-1
